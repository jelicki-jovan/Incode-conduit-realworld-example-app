name: Promote image
description: >
  Copy an image from one environment's ECR repository to the next one (e.g. dev → prod) without
  rebuilding it, and verify both have the same digest: the next environment runs exactly the bytes
  that were tested. The calling job needs `id-token: write` (GitHub OIDC → AWS role).

inputs:
  app:
    description: App name (backend or frontend)
    required: true
  from-environment:
    description: Source environment (e.g. dev)
    required: true
  to-environment:
    description: Target environment (e.g. prod)
    required: true
  image-tag:
    description: Image tag to promote (short git SHA)
    required: true
  registry:
    description: ECR registry
    required: false
    default: 003636669641.dkr.ecr.us-east-1.amazonaws.com
  role-arn:
    description: AWS role allowed to pull from the source and push to the target repository
    required: false
    default: arn:aws:iam::003636669641:role/hw-github-actions-ecr
  aws-region:
    description: AWS region
    required: false
    default: us-east-1

runs:
  using: composite
  steps:
    - name: AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Copy image and verify digest
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        SRC_REPO: hw-${{ inputs.app }}-${{ inputs.from-environment }}
        DST_REPO: hw-${{ inputs.app }}-${{ inputs.to-environment }}
        TAG: ${{ inputs.image-tag }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail
        digest() { aws ecr describe-images --repository-name "$1" --image-ids imageTag="$TAG" \
                     --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true; }

        # Tags are immutable: on a re-run the image may already be in the target repository
        if [ -z "$(digest "$DST_REPO")" ]; then
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "$REGISTRY/$SRC_REPO:$TAG"
          docker tag "$REGISTRY/$SRC_REPO:$TAG" "$REGISTRY/$DST_REPO:$TAG"
          docker push "$REGISTRY/$DST_REPO:$TAG"
        fi

        src=$(digest "$SRC_REPO"); dst=$(digest "$DST_REPO")
        [ -n "$src" ] && [ "$src" = "$dst" ] || { echo "::error::digest mismatch: $SRC_REPO $src, $DST_REPO $dst"; exit 1; }
        echo "Promoted $SRC_REPO:$TAG → $DST_REPO:$TAG (digest $dst)" | tee -a "$GITHUB_STEP_SUMMARY"
